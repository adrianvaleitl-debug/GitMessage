name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set release version
        shell: pwsh
        run: npm version "4.0.${{ github.run_number }}" --no-git-tag-version
      - name: Install dependencies
        run: npm install
      - name: Generate real multi-resolution Windows icon
        shell: pwsh
        run: |
          npm install --no-save sharp png-to-ico
          New-Item -ItemType Directory -Force -Path build, .icon-temp | Out-Null
          node -e "const sharp=require('sharp'); const pngToIco=require('png-to-ico'); const fs=require('fs'); (async()=>{const files=[]; for(const size of [16,32,48,64,128,256]){const file='.icon-temp/'+size+'.png'; await sharp('public/gitmessage-icon.svg').resize(size,size).png().toFile(file); files.push(file);} fs.writeFileSync('build/gitmessage.ico',await pngToIco(files));})().catch(e=>{console.error(e);process.exit(1);});"
      - name: Build renderer
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://pvoywcvyhfuszalczycm.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: GitMessage-Windows-Installer
          path: release/*
          if-no-files-found: error
      - name: Publish installer and update metadata to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gitmessage-build-${{ github.run_number }}
          name: GitMessage build ${{ github.run_number }}
          body: Automated Windows installer build from commit ${{ github.sha }}. Includes automatic update metadata and refreshed application icon.
          prerelease: true
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
